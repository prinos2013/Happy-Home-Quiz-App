        };

        const TABLE_KEY_MAP = {
            SETTINGS: DB_KEYS.SETTINGS,
            TEACHERS: DB_KEYS.TEACHERS,
            QUESTIONS: DB_KEYS.QUESTIONS,
            ATTEMPTS: DB_KEYS.ATTEMPTS
        };

        const HAPPY_CLASSES = ['Basic 1', 'Basic 2', 'Basic 3', 'Basic 4', 'Basic 5', 'Basic 6', 'JHS 1', 'JHS 2', 'JHS 3'];
        const HAPPY_SUBJECTS = ['English Language', 'Mathematics', 'Science', 'R.M.E.', 'Social Studies'];

        let activeQuizState = {
            isGoogleForm: false,
            formUrl: '',
            questions: [],
            timerInterval: null,
            secondsRemaining: 0,
            activeStudent: null,
            subject: '',
            classGroup: ''

        const generateID = () => 'Q_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

        // --- PWA Installation Logic ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('installAppBtn');
            if (installBtn) installBtn.classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    deferredPrompt = null;
                    const installBtn = document.getElementById('installAppBtn');
                    if (installBtn) installBtn.classList.add('hidden');
                });
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration failed:', err));

        // --- App Logic ---
        function getCloudSyncUrl() {
            const s = getSettings();
            return (s.cloudSyncUrl && s.cloudSyncUrl.trim() !== '') 
                ? s.cloudSyncUrl.trim() 
                : (localStorage.getItem(DB_KEYS.CLOUD_URL) || DEFAULT_CLOUD_SYNC_URL).trim();
        }

        function setCloudBadgeStatus(state, text) {
            const badge = document.getElementById('cloud-sync-badge');
            if (!badge) return;
            if (state === 'syncing') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800";
                badge.innerHTML = `<i class="fas fa-sync fa-spin mr-1.5"></i> ${text || 'Syncing Cloud...'}`;
            } else if (state === 'synced') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800";
                badge.innerHTML = `<i class="fas fa-cloud mr-1.5"></i> ${text || 'Cloud Synced'}`;
            } else if (state === 'pending') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800";
                badge.innerHTML = `<i class="fas fa-cloud-upload-alt mr-1.5"></i> ${text || 'Queued Offline'}`;
            } else {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600";
                badge.innerHTML = `<i class="fas fa-cloud mr-1.5"></i> ${text || 'Offline Mode'}`;
            }
        }

        async function saveTableAndSync(tableName, dataObj) {
            const storageKey = TABLE_KEY_MAP[tableName];
            if (!storageKey) return;
            localStorage.setItem(storageKey, JSON.stringify(dataObj));

            const url = getCloudSyncUrl();
            if (!url) {
                setCloudBadgeStatus('local', 'Offline Mode');
                return;
            }

            if (!navigator.onLine) {
                localStorage.setItem(DB_KEYS.PENDING_SYNC, 'true');
                setCloudBadgeStatus('pending', 'Saved Locally (Offline Queue)');
                return;
            }

            setCloudBadgeStatus('syncing', 'Saving to Cloud...');
            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'SYNC_TABLE', table: tableName, records: dataObj })
                });
                localStorage.removeItem(DB_KEYS.PENDING_SYNC);
                setCloudBadgeStatus('synced', 'Cloud Synced');
            } catch (err) {
                localStorage.setItem(DB_KEYS.PENDING_SYNC, 'true');
                setCloudBadgeStatus('pending', 'Sync Retry Queued');
            }
        }

        async function pushAllTablesToCloud(showNotification = true) {
            const url = getCloudSyncUrl();
            if (!url) {
                if (showNotification) showToast('Cloud URL Missing', 'Please paste your Google Apps Script Web App URL first.', true);
                return;
            }
            setCloudBadgeStatus('syncing', 'Pushing All Data...');
            const payloadData = {};
            Object.keys(TABLE_KEY_MAP).forEach(tableName => {
                const raw = localStorage.getItem(TABLE_KEY_MAP[tableName]);
                payloadData[tableName] = raw ? JSON.parse(raw) : null;
            });

            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'SYNC_ALL', data: payloadData })
                });
                localStorage.removeItem(DB_KEYS.PENDING_SYNC);
                setCloudBadgeStatus('synced', 'All Data Pushed');
                if (showNotification) showToast('Cloud Push Complete', 'Data synchronized.');
            } catch (err) {
                setCloudBadgeStatus('pending', 'Push Failed');
                if (showNotification) showToast('Cloud Push Error', 'Could not reach Google Sheets. Check connection.', true);
            }
        }

        async function pullFromCloud(showNotification = false) {
            const url = getCloudSyncUrl();
            if (!url || !navigator.onLine) {
                setCloudBadgeStatus(url ? 'pending' : 'local', 'Offline Mode');
                return false;
            }

            setCloudBadgeStatus('syncing', 'Fetching Cloud Updates...');
            try {
                const res = await fetch(url + '?t=' + Date.now());
                const json = await res.json();
                if (json && json.status === 'success' && json.data) {
                    let updatedAny = false;
                    Object.keys(TABLE_KEY_MAP).forEach(tableName => {
                        const cloudVal = json.data[tableName];
                        if (cloudVal !== null && cloudVal !== undefined) {
                            if (tableName === 'SETTINGS') {
                                cloudVal.cloudSyncUrl = cloudVal.cloudSyncUrl || url;
                                cloudVal.adminPasscode = cloudVal.adminPasscode || getSettings().adminPasscode || 'admin123';
                            }
                            localStorage.setItem(TABLE_KEY_MAP[tableName], JSON.stringify(cloudVal));
                            updatedAny = true;
                        }
                    });
                    setCloudBadgeStatus('synced', 'Cloud Synced');
                    if (showNotification) showToast('Cloud Synced!', 'Latest records loaded successfully.');
                    if (updatedAny) renderApp();
                    return true;
                }
            } catch (err) {
                setCloudBadgeStatus('pending', 'Offline Mode');
            }
            return false;
        }

        function attachStudentPortalListeners() {
            document.getElementById('startTestForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('studentName').value.trim();
                const sClass = document.getElementById('studentClass').value;
                const subject = document.getElementById('studentSubject').value;

                const allQuestions = JSON.parse(localStorage.getItem(DB_KEYS.QUESTIONS) || '[]');
                
                let gFormEntry = allQuestions.find(q => q.type === 'google_form' && q.class === sClass && q.subject === subject);

                if (gFormEntry) {
                    activeQuizState.isGoogleForm = true;
                    activeQuizState.formUrl = gFormEntry.url;
                    activeQuizState.questions = [gFormEntry]; 
                } else {
                    activeQuizState.isGoogleForm = false;
                    let matchingQuestions = allQuestions.filter(q => q.type !== 'google_form' && q.class === sClass && q.subject === subject);
                    if (matchingQuestions.length === 0) {
                        alert(`No questions available for ${sClass} - ${subject}. Please ask your teacher to add questions to the question bank.`);
                        return;
                    }
                    matchingQuestions.sort(() => Math.random() - 0.5);
                    activeQuizState.questions = matchingQuestions.slice(0, 10);
                }

                activeQuizState.activeStudent = { name, class: sClass, subject };
                
                document.getElementById('studentLoginForm').classList.add('hidden');
                document.getElementById('examInterface').classList.remove('hidden');
                
                let examTitle = activeQuizState.isGoogleForm ? `${subject} (${sClass}) - Embedded Google Form` : `${subject} (${sClass}) - ${activeQuizState.questions.length} Questions`;
                document.getElementById('examTitleDisplay').innerText = examTitle;
                document.getElementById('studentInfoDisplay').innerText = `Student: ${name} | Class: ${sClass}`;

                activeQuizState.secondsRemaining = (activeQuizState.questions[0].timer || 10) * 60;
                startExamTimer();
                renderExamQuestions();
            });
        }

        function startExamTimer() {
            if (activeQuizState.timerInterval) clearInterval(activeQuizState.timerInterval);
            activeQuizState.timerInterval = setInterval(() => {
                if (activeQuizState.secondsRemaining <= 0) {
                    clearInterval(activeQuizState.timerInterval);
                    alert("Time is up! Submitting exam automatically.");
                    if (activeQuizState.isGoogleForm) {
                        finishGoogleFormExam();
                    } else {
                        submitStudentExam();
                    }
                    return;
                }
                activeQuizState.secondsRemaining--;
                let mins = Math.floor(activeQuizState.secondsRemaining / 60);
                let secs = activeQuizState.secondsRemaining % 60;
                const timeCountEl = document.getElementById('timeCount');
                if (timeCountEl) {
                    timeCountEl.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                }
            }, 1000);
        }

        // --- FOOLPROOF SCORING FIX IMPLEMENTED HERE ---
        function submitStudentExam() {
            if (activeQuizState.timerInterval) clearInterval(activeQuizState.timerInterval);
            let score = 0;
            let total = activeQuizState.questions.length;

            activeQuizState.questions.forEach(q => {
                // Directly fetch the selected radio button from the screen
                const selectedOption = document.querySelector(`input[name="q_${q.id}"]:checked`);
                const studentAnswer = selectedOption ? selectedOption.value : null;
                
                // Imported workbooks may store the key as A-D, 1-4, or the full
                // option text. Resolve it against this question's actual options.
                const correctAnswer = normalizeCorrectAnswer(
                    q.correct ?? q.correctAnswer ?? q.answer ?? q.answerKey,
                    q
                );

                if (studentAnswer && correctAnswer && studentAnswer.toUpperCase() === correctAnswer) {
                    score++;
                } else if (!correctAnswer) {
                    console.warn('Question has an unrecognized answer key:', q.id, q.correct);
                }
            });

            let percentage = total > 0 ? Math.round((score / total) * 100) : 0;
            
            let remark = "";
            let feedbackDesc = "";
            
            if (percentage >= 80) {
                remark = "Excellent";
                feedbackDesc = "Exceptional understanding demonstrated across all tasks.";
            } else if (percentage >= 70) {
                remark = "Very Good";
                feedbackDesc = "Displays a very strong grasp of coursework.";
            } else if (percentage >= 60) {
                remark = "Good";
                feedbackDesc = "Shows steady academic progress and effort.";
            } else if (percentage >= 50) {
                remark = "Satisfactory";
                feedbackDesc = "Meets the fundamental requirements of the course.";
            } else {
                remark = "Needs Improvement";
                feedbackDesc = "Requires more focused effort to meet fundamental learning goals.";
            }

            document.getElementById('examInterface').classList.add('hidden');
            document.getElementById('resultInterface').classList.remove('hidden');
            
            document.getElementById('certStudentName').innerText = activeQuizState.activeStudent.name;
            document.getElementById('certStudentClass').innerText = activeQuizState.activeStudent.class;
            document.getElementById('certSubject').innerText = activeQuizState.activeStudent.subject;
            document.getElementById('certScoreText').innerText = `${score} / ${total}`;
            
            document.getElementById('certRemarkTitle').innerText = remark;
            document.getElementById('certFeedbackDesc').innerText = feedbackDesc;

            const submissionData = {
                id: 'ATT-' + Math.random().toString(36).substr(2,6).toUpperCase(),
                name: activeQuizState.activeStudent.name,
                class: activeQuizState.activeStudent.class,
                subject: activeQuizState.activeStudent.subject,
                score: score,
                total: total,
                percentage: percentage,
                remark: remark,
                feedback: feedbackDesc,
                timestamp: new Date().toLocaleString()
            };

            const attempts = JSON.parse(localStorage.getItem(DB_KEYS.ATTEMPTS) || '[]');
            attempts.unshift(submissionData);
            saveTableAndSync('ATTEMPTS', attempts);
            
            dispatchSubmissionToSheet(submissionData);
        }

        function dispatchSubmissionToSheet(data) {
            const url = getCloudSyncUrl();
            if (!url) {
                saveToOfflineQueue(data);
                return;
            }
            if (!navigator.onLine) {
                saveToOfflineQueue(data);
                showToast("Offline Mode", "Result saved locally. Will sync when online.", true);
                return;
            }
            fetch(url, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: 'APPEND_RESULT', record: data })
            }).catch(() => saveToOfflineQueue(data));
        }

        function saveToOfflineQueue(data) {
            let queue = JSON.parse(localStorage.getItem(DB_KEYS.PENDING_SYNC + '_results') || '[]');
            queue.push(data);
            localStorage.setItem(DB_KEYS.PENDING_SYNC + '_results', JSON.stringify(queue));
        }

        function syncOfflineSubmissions() {
            const url = getCloudSyncUrl();
            let queue = JSON.parse(localStorage.getItem(DB_KEYS.PENDING_SYNC + '_results') || '[]');
            if (queue.length === 0 || !url) return;

            queue.forEach(item => {
                fetch(url, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: 'APPEND_RESULT', record: item })
                });
            });
            localStorage.removeItem(DB_KEYS.PENDING_SYNC + '_results');
        }

        // Normalize spreadsheet headings so different Excel template labels are accepted.
        function normalizeHeaderKey(value) {
            return String(value == null ? '' : value).trim().toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        // Parse CSV/TSV safely, including quoted cells that contain commas or line breaks.
        function parseDelimitedRows(sourceText) {
            const text = String(sourceText || '').replace(/^\uFEFF/, '');
            const firstLine = text.split(/\r?\n/, 1)[0] || '';
            const delimiters = [',', ';', '\t'];
            const delimiter = delimiters.map(d => ({
                value: d,
                count: (firstLine.match(new RegExp(d === '\t' ? '\\t' : d.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g')) || []).length
            })).sort((a, b) => b.count - a.count)[0].value;

            const rows = [];
            let row = [];
            let cell = '';
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (ch === '"') {
                    if (inQuotes && text[i + 1] === '"') {
                        cell += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === delimiter && !inQuotes) {
                    row.push(cell.trim());
                    cell = '';
                } else if ((ch === '\n' || ch === '\r') && !inQuotes) {
                    if (ch === '\r' && text[i + 1] === '\n') i++;
                    row.push(cell.trim());
                    if (row.some(value => String(value).trim() !== '')) rows.push(row);
                    row = [];
                    cell = '';
                } else {
                    cell += ch;
                }
            }

            row.push(cell.trim());
            if (row.some(value => String(value).trim() !== '')) rows.push(row);
            return rows;
        }

        function normalizeAnswerText(value) {
            return String(value == null ? '' : value)
                .trim()
                .toLowerCase()
                .replace(/^[a-d]\s*[).:\-]\s*/, '')
                .replace(/\s+/g, ' ')
                .replace(/[.!?]+$/, '');
        }

        // Convert answer keys such as B, Option B, 2, or the full option text into A-D.
        function normalizeCorrectAnswer(value, questionOrOptions) {
            const raw = String(value == null ? '' : value).trim();
            if (!raw) return null;

            const options = Array.isArray(questionOrOptions)
                ? questionOrOptions
                : [
                    questionOrOptions && questionOrOptions.optA,
                    questionOrOptions && questionOrOptions.optB,
                    questionOrOptions && questionOrOptions.optC,
                    questionOrOptions && questionOrOptions.optD
                ];

            let match = raw.match(/^(?:OPTION|CHOICE)\s*([A-D])\b/i);
            if (match) return match[1].toUpperCase();

            match = raw.match(/^[\(\[]([A-D])[\)\]]$/i);
            if (match) return match[1].toUpperCase();

            match = raw.match(/^([A-D])\s*(?:[).:\-]|$)/i);
            if (match) return match[1].toUpperCase();

            match = raw.match(/\b(?:CORRECT\s+ANSWER|ANSWER|OPTION|CHOICE)\s*(?:IS\s*)?[:=\-]?\s*([A-D])\b/i);
            if (match) return match[1].toUpperCase();

            const answerText = normalizeAnswerText(raw);
            for (let i = 0; i < 4; i++) {
                const optionText = normalizeAnswerText(options[i]);
                if (optionText && answerText === optionText) return 'ABCD'[i];
            }

            if (/^[1-4]$/.test(raw)) return 'ABCD'[Number(raw) - 1];
            return null;
        }

        function findHeaderIndex(headers, aliases, fallbackIndex) {
            for (const alias of aliases) {
                const index = headers.indexOf(alias);
                if (index >= 0) return index;
            }
            const extendedIndex = headers.findIndex(header => aliases.some(alias => alias.length >= 4 && header.startsWith(alias)));
            return extendedIndex >= 0 ? extendedIndex : fallbackIndex;
        }

        function getSpreadsheetColumnMap(headerRow) {
            const headers = headerRow.map(normalizeHeaderKey);
            const hasQuestionHeader = headers.some(h => ['question', 'questions', 'questiontext', 'item', 'itemtext'].includes(h));
            if (!hasQuestionHeader) {
                return {
                    hasHeader: false,
                    classIndex: 0, subjectIndex: 1, questionIndex: 2,
                    optionAIndex: 3, optionBIndex: 4, optionCIndex: 5, optionDIndex: 6,
                    correctIndex: 7, timerIndex: 8
                };
            }

            return {
                hasHeader: true,
                classIndex: findHeaderIndex(headers, ['class', 'classname', 'targetclass', 'classgroup', 'grade', 'level'], -1),
                subjectIndex: findHeaderIndex(headers, ['subject', 'subjectname'], -1),
                questionIndex: findHeaderIndex(headers, ['question', 'questions', 'questiontext', 'item', 'itemtext'], -1),
                optionAIndex: findHeaderIndex(headers, ['optiona', 'choicea', 'answera', 'option1', 'choice1', 'a'], -1),
                optionBIndex: findHeaderIndex(headers, ['optionb', 'choiceb', 'answerb', 'option2', 'choice2', 'b'], -1),
                optionCIndex: findHeaderIndex(headers, ['optionc', 'choicec', 'answerc', 'option3', 'choice3', 'c'], -1),
                optionDIndex: findHeaderIndex(headers, ['optiond', 'choiced', 'answerd', 'option4', 'choice4', 'd'], -1),
                correctIndex: findHeaderIndex(headers, ['correctanswer', 'answerkey', 'correctoption', 'correct', 'answer', 'key'], -1),
                timerIndex: findHeaderIndex(headers, ['timerminutes', 'timer', 'duration', 'timelimit'], -1)
            };
        }

        function makeQuestionFromSpreadsheetRow(row, columnMap, rowNumber) {
            const cell = index => index >= 0 && index < row.length ? String(row[index] == null ? '' : row[index]).trim() : '';
            const fallbackClass = document.getElementById('qClass').value;
            const fallbackSubject = document.getElementById('qSubject').value;
            const options = [
                cell(columnMap.optionAIndex), cell(columnMap.optionBIndex),
                cell(columnMap.optionCIndex), cell(columnMap.optionDIndex)
            ];
            const questionText = cell(columnMap.questionIndex);
            const correctValue = cell(columnMap.correctIndex);
            const correctLetter = normalizeCorrectAnswer(correctValue, options);

            if (!questionText || options.some(option => !option) || !correctLetter) {
                return {
                    question: null,
                    reason: !questionText ? 'question text missing' : options.some(option => !option) ? 'one or more options missing' : `unrecognized correct answer "${correctValue}"`
                };
            }

            const timerValue = parseInt(cell(columnMap.timerIndex), 10);
            return {
                question: {
                    id: generateID(),
                    class: cell(columnMap.classIndex) || fallbackClass,
                    subject: cell(columnMap.subjectIndex) || fallbackSubject,
                    text: questionText,
                    optA: options[0], optB: options[1], optC: options[2], optD: options[3],
                    correct: correctLetter,
                    timer: Number.isFinite(timerValue) && timerValue > 0
                        ? timerValue
                        : (parseInt(document.getElementById('testTimerMinutes').value, 10) || 10)
                },
                reason: null
            };
        }

        function handleAiDocumentUpload(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const extension = file.name.split('.').pop().toLowerCase();
            const textarea = document.getElementById('ai-raw-text');
            const reader = new FileReader();

            if (extension === 'xlsx' || extension === 'xls') {
                if (typeof XLSX === 'undefined') {
                    alert('The Excel reader could not load. Connect to the Internet, refresh the app, and try again. You can also save the workbook as CSV and upload the CSV file.');
                    event.target.value = '';
                    return;
                }

                reader.onload = function(e) {
                    try {
                        const workbook = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        if (!firstSheetName) throw new Error('The workbook has no worksheets.');
                        const worksheet = workbook.Sheets[firstSheetName];
                        uploadedSpreadsheetRows = XLSX.utils.sheet_to_json(worksheet, {
                            header: 1, defval: '', raw: false, blankrows: false
                        });
                        uploadedSpreadsheetPreviewText = XLSX.utils.sheet_to_csv(worksheet);
                        textarea.value = uploadedSpreadsheetPreviewText;
                        alert(`Excel file ${file.name} loaded successfully. Review the preview, then click 'Auto-Generate Questions'.`);
                    } catch (error) {
                        uploadedSpreadsheetRows = null;
                        uploadedSpreadsheetPreviewText = '';
                        alert(`Could not read this Excel file: ${error.message || error}`);
                    }
                };
                reader.onerror = () => alert('The selected Excel file could not be read. Please try saving it again.');
                reader.readAsArrayBuffer(file);
                return;
            }

            uploadedSpreadsheetRows = null;
            uploadedSpreadsheetPreviewText = '';
            reader.onload = function(e) {
                textarea.value = e.target.result;
                alert(`File ${file.name} loaded successfully. Click 'Auto-Generate Questions'.`);
            };
            reader.onerror = () => alert('The selected file could not be read.');
            reader.readAsText(file, 'UTF-8');
        }

        // Stable identity for imported questions. Re-importing a corrected workbook
        // replaces old copies instead of leaving stale, incorrectly keyed duplicates.
        function questionBankIdentity(question) {
            if (!question || question.type === 'google_form') return '';
            const clean = value => String(value == null ? '' : value).trim().toLowerCase().replace(/\s+/g, ' ');
            return JSON.stringify([
                clean(question.class),
                clean(question.subject),
                clean(question.text)
            ]);
        }

        function parseTextIntoQuestions() {
            const rawText = document.getElementById('ai-raw-text').value.trim();
            if (!rawText) {
                alert('Please paste text, CSV, or upload an Excel workbook first.');
                return;
            }

            const existingQuestions = JSON.parse(localStorage.getItem(DB_KEYS.QUESTIONS) || '[]');
            const importedQuestions = [];
            let parsedCount = 0;
            let skippedCount = 0;
            const skipReasons = [];

            const rows = uploadedSpreadsheetRows && rawText === uploadedSpreadsheetPreviewText.trim()
                ? uploadedSpreadsheetRows
                : parseDelimitedRows(rawText);

            const firstRowMap = rows.length ? getSpreadsheetColumnMap(rows[0]) : null;
            const isTabular = rows.some(row => row.length >= 8) || (firstRowMap && firstRowMap.hasHeader);

            if (isTabular && rows.length) {
                const columnMap = firstRowMap;
                const dataRows = columnMap.hasHeader ? rows.slice(1) : rows;
                dataRows.forEach((row, index) => {
                    if (!row.some(value => String(value == null ? '' : value).trim() !== '')) return;
                    const result = makeQuestionFromSpreadsheetRow(row, columnMap, index + (columnMap.hasHeader ? 2 : 1));
                    if (result.question) {
                        importedQuestions.push(result.question);
                        parsedCount++;
                    } else {
                        skippedCount++;
                        if (skipReasons.length < 4) skipReasons.push(`Row ${index + (columnMap.hasHeader ? 2 : 1)}: ${result.reason}`);
                    }
                });
            } else {
                // Retain support for the simple numbered-question text format.
                const lines = rawText.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
                let currentQuestion = '';
                let currentOptions = [];
                let correctOption = 'A';

                const saveCurrentTextQuestion = () => {
                    if (!currentQuestion || currentOptions.length < 2) return;
                    const options = [currentOptions[0], currentOptions[1], currentOptions[2] || 'Option C', currentOptions[3] || 'Option D'];
                    const normalized = normalizeCorrectAnswer(correctOption, options) || 'A';
                    importedQuestions.push({
                        id: generateID(),
                        class: document.getElementById('qClass').value,
                        subject: document.getElementById('qSubject').value,
                        text: currentQuestion,
                        optA: options[0], optB: options[1], optC: options[2], optD: options[3],
                        correct: normalized,
                        timer: parseInt(document.getElementById('testTimerMinutes').value, 10) || 10
                    });
                    parsedCount++;
                };

                lines.forEach(line => {
                    const answerLine = line.match(/^(?:correct\s+answer|answer|key)\s*[:=\-]\s*(.+)$/i);
                    if (answerLine && currentQuestion) {
                        correctOption = answerLine[1].trim();
                        return;
                    }

                    if (/^\d+[.)]\s*/.test(line)) {
                        saveCurrentTextQuestion();
                        currentQuestion = line.replace(/^\d+[.)]\s*/, '');
                        currentOptions = [];
                        correctOption = 'A';
                    } else {
                        const optionMatch = line.match(/^([a-d])[.)]\s*(.*)$/i);
                        if (optionMatch) {
                            const optionText = optionMatch[2].replace(/\s*[([]correct[)\]]\s*/i, '').trim();
                            currentOptions.push(optionText);
                            if (/\(correct\)|\[correct\]/i.test(line)) correctOption = optionMatch[1].toUpperCase();
                        } else if (currentQuestion && currentOptions.length < 4) {
                            currentOptions.push(line);
                        }
                    }
                });
                saveCurrentTextQuestion();
            }

            if (parsedCount === 0) {
                const detail = skipReasons.length ? ` ${skipReasons.join('; ')}` : '';
                alert(`No questions were imported. Check that each row has a question, four options, and a recognizable correct answer (A-D, 1-4, or the exact option text).${detail}`);
                return;
            }

            // Replace previously imported copies with the corrected question records.
            // This repairs banks created by the old importer, which truncated answer text
            // and split quoted CSV cells incorrectly.
            const importedIdentities = new Set(importedQuestions.map(questionBankIdentity).filter(Boolean));
            const retainedQuestions = existingQuestions.filter(question => {
                const identity = questionBankIdentity(question);
                return !identity || !importedIdentities.has(identity);
            });
            const mergedQuestions = retainedQuestions.concat(importedQuestions);
            saveTableAndSync('QUESTIONS', mergedQuestions);
            renderQuestionList();
            const skippedMessage = skippedCount ? ` ${skippedCount} incomplete/invalid row(s) were skipped.` : '';
            const reasonMessage = skipReasons.length ? `\n${skipReasons.join('\n')}` : '';
            alert(`Importer successfully added ${parsedCount} question(s) to the question bank.${skippedMessage}${reasonMessage}`);

            // Clear only the structured workbook cache; the preview stays available for review.
            uploadedSpreadsheetRows = null;
            uploadedSpreadsheetPreviewText = '';
        }

        function renderQuestionList() {
            const container = document.getElementById('questionListContainer');
            if (!container) return;
            const questions = JSON.parse(localStorage.getItem(DB_KEYS.QUESTIONS) || '[]');
            container.innerHTML = "";
            if (questions.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400">No questions available.</p>`;
                return;
            }
            questions.forEach(q => {
                if (q.type === 'google_form') {
                    container.innerHTML += `
                        <div class="flex justify-between items-center p-2 bg-blue-50 border border-blue-200 rounded text-xs">
                            <div><b class="text-blue-900">[${q.class} - ${q.subject}]</b> Google Form Embedded (${q.timer} mins)</div>
                            <button onclick="deleteQuestion('${q.id}')" class="text-red-500 font-bold px-2 py-1 hover:bg-red-50 rounded">Delete</button>
                        </div>
                    `;
                } else {
                    container.innerHTML += `
                        <div class="flex justify-between items-center p-2 bg-gray-50 border rounded text-xs">
                            <div><b>[${q.class} - ${q.subject}]</b> ${q.text.substring(0, 50)}... (Correct: ${q.correct})</div>
                            <button onclick="deleteQuestion('${q.id}')" class="text-red-500 font-bold px-2 py-1 hover:bg-red-50 rounded">Delete</button>
                        </div>
                    `;
                }
            });
        }

        function deleteQuestion(id) {
            let questions = JSON.parse(localStorage.getItem(DB_KEYS.QUESTIONS) || '[]');
            questions = questions.filter(q => q.id !== id);
            saveTableAndSync('QUESTIONS', questions);
            renderQuestionList();
        }

        function canManageStudentSubmission(user, attempt) {
            if (!user || !attempt) return false;
            if (user.role === 'admin') return true;
            if (user.role !== 'teacher') return false;

            const assignedClasses = Array.isArray(user.assignedClasses)
                ? user.assignedClasses.map(value => String(value).trim().toLowerCase())
                : [];
            const attemptClass = String(attempt.class || '').trim().toLowerCase();
            return assignedClasses.includes('all classes') || (!!attemptClass && assignedClasses.includes(attemptClass));
        }

        function updateStudentSubmissionSelectionUI() {
            const checkboxes = Array.from(document.querySelectorAll('.student-submission-checkbox'));
            const selectedCount = checkboxes.filter(input => input.checked).length;
            const deleteButton = document.getElementById('deleteSelectedSubmissionsBtn');
            const selectAll = document.getElementById('selectAllSubmissions');

            if (deleteButton) {
                deleteButton.disabled = selectedCount === 0;
                deleteButton.innerHTML = `<i class="fas fa-trash-alt mr-1"></i> Delete Selected (${selectedCount})`;
            }
            if (selectAll) {
                selectAll.checked = checkboxes.length > 0 && selectedCount === checkboxes.length;
                selectAll.indeterminate = selectedCount > 0 && selectedCount < checkboxes.length;
            }
        }

        function toggleAllStudentSubmissions(checked) {
            document.querySelectorAll('.student-submission-checkbox').forEach(input => {
                input.checked = !!checked;
            });
            updateStudentSubmissionSelectionUI();
        }

        function deleteStudentSubmission(attemptIndex) {
            const currentUser = getCurrentUser();
            const index = Number(attemptIndex);
            const attempts = JSON.parse(localStorage.getItem(DB_KEYS.ATTEMPTS) || '[]');

            if (!Number.isInteger(index) || index < 0 || index >= attempts.length) {
                showToast('Submission Not Found', 'Refresh the results list and try again.', true);
                return;
            }
            if (!canManageStudentSubmission(currentUser, attempts[index])) {
                showToast('Permission Denied', 'You can only delete submissions from your assigned classes.', true);
                return;
            }
            if (!confirm(`Delete the submission for ${attempts[index].name || 'this student'}? This action cannot be undone.`)) return;

            attempts.splice(index, 1);
            saveTableAndSync('ATTEMPTS', attempts);
            renderTeacherResults();
            showToast('Submission Deleted', 'The student submission has been removed.');
        }

        function deleteSelectedStudentSubmissions() {
            const currentUser = getCurrentUser();
            const selectedInputs = Array.from(document.querySelectorAll('.student-submission-checkbox:checked'));
            const selectedIndices = [...new Set(selectedInputs.map(input => Number(input.value)))];

            if (selectedIndices.length === 0) {
                showToast('Nothing Selected', 'Select at least one submission to delete.', true);
                return;
            }

            const attempts = JSON.parse(localStorage.getItem(DB_KEYS.ATTEMPTS) || '[]');
            const validIndices = selectedIndices.filter(index =>
                Number.isInteger(index) && index >= 0 && index < attempts.length
            );
            if (validIndices.length !== selectedIndices.length ||
                validIndices.some(index => !canManageStudentSubmission(currentUser, attempts[index]))) {
                showToast('Permission Denied', 'One or more selected submissions are outside your assigned classes. Refresh and try again.', true);
                return;
            }

            if (!confirm(`Delete ${validIndices.length} selected student submission(s)? This action cannot be undone.`)) return;

            const indicesToDelete = new Set(validIndices);
            const remainingAttempts = attempts.filter((attempt, index) => !indicesToDelete.has(index));
            saveTableAndSync('ATTEMPTS', remainingAttempts);
            renderTeacherResults();
            showToast('Submissions Deleted', `${validIndices.length} student submission(s) have been removed.`);
        }

        function renderTeacherResults() {
            const container = document.getElementById('teacherResultsTableBody');
            if (!container) return;
            const attempts = JSON.parse(localStorage.getItem(DB_KEYS.ATTEMPTS) || '[]');
            const currentUser = getCurrentUser();

            // Keep the original array index so deletion targets the exact stored record.
            const visibleAttempts = attempts
                .map((attempt, index) => ({ attempt, index }))
                .filter(item => canManageStudentSubmission(currentUser, item.attempt));

            container.innerHTML = "";
            if (visibleAttempts.length === 0) {
                container.innerHTML = `<tr><td colspan="8" class="p-4 text-center text-gray-400">No submissions found for your assigned classes.</td></tr>`;
                updateStudentSubmissionSelectionUI();
                return;
            }

            visibleAttempts.forEach(({ attempt: a, index }) => {
                let remarkColor = "text-green-600";
                if (a.remark === "Needs Improvement") remarkColor = "text-red-600";
                if (a.remark === "Satisfactory") remarkColor = "text-amber-600";
                if (a.remark === "Results Forwarded") remarkColor = "text-blue-600";
                const dateText = String(a.timestamp || '').split(',')[0] || '—';
                const scoreText = a.score !== 'N/A' ? `${a.score}/${a.total} (${a.percentage}%)` : 'N/A';

                container.innerHTML += `
                    <tr class="border-b hover:bg-slate-50 transition">
                        <td class="p-2 border text-center"><input type="checkbox" class="student-submission-checkbox w-4 h-4 accent-purple-700" value="${index}" aria-label="Select submission for ${String(a.name || 'student').replace(/&/g, '&amp;').replace(/"/g, '&quot;') }" onchange="updateStudentSubmissionSelectionUI()"></td>
                        <td class="p-2 border whitespace-nowrap">${dateText}</td>
                        <td class="p-2 border font-bold text-primary">${a.name || '—'}</td>
                        <td class="p-2 border">${a.class || '—'}</td>
                        <td class="p-2 border">${a.subject || '—'}</td>
                        <td class="p-2 border font-bold">${scoreText}</td>
                        <td class="p-2 border font-bold ${remarkColor}">${a.remark || '—'}</td>
                        <td class="p-2 border text-center"><button type="button" onclick="deleteStudentSubmission(${index})" class="px-2 py-1 text-red-600 hover:bg-red-50 rounded font-semibold" title="Delete this submission"><i class="fas fa-trash-alt mr-1"></i>Delete</button></td>
                    </tr>
                `;
            });
            updateStudentSubmissionSelectionUI();
        }

        function renderTeacherList() {
            const container = document.getElementById('teacherListContainer');
            if (!container) return;
            const teachers = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
            const currentUser = getCurrentUser();
            container.innerHTML = "";
            teachers.forEach(t => {
                const classesStr = t.assignedClasses ? t.assignedClasses.join(', ') : 'All Classes';
                container.innerHTML += `
                    <div class="flex justify-between items-center p-2.5 bg-gray-50 border rounded text-xs">
                        <div><b>${t.name}</b> (${t.username}) - Assigned Classes: <span class="text-indigo-600 font-bold">${classesStr}</span> - <span class="uppercase text-purple-600 font-semibold">${t.role}</span></div>
                        ${currentUser && currentUser.role === 'admin' ? `<button onclick="deleteTeacher('${t.id}')" class="text-red-500 font-bold px-2 py-1 hover:bg-red-50 rounded">Remove</button>` : ''}
                    </div>
                `;
            });
        }

        function deleteTeacher(teacherId) {
            if (!confirm("Are you sure you want to remove this teacher?")) return;
            let teachers = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
            teachers = teachers.filter(t => t.id !== teacherId);
            saveTableAndSync('TEACHERS', teachers);
            renderTeacherList();
            showToast("Success", "Teacher removed successfully.");
        }

        function saveCloudUrlSetting() {
            const urlInput = document.getElementById('settingCloudUrl').value.trim();
            localStorage.setItem(DB_KEYS.CLOUD_URL, urlInput);
            const s = getSettings();
            s.cloudSyncUrl = urlInput;
            saveTableAndSync('SETTINGS', s);
            alert("Cloud URL saved successfully!");
            pullFromCloud(true);
        }

        window.onload = function() {
            initDatabase();
            renderApp();
            if (getCloudSyncUrl()) {
                pullFromCloud(false);
            }
        };
    </script>
</body>
</html>
