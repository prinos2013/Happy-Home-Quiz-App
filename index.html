        <div>
            This App was built by: <strong>Prinesther Educational Consult 0246645506/0202164699</strong>
        </div>
        <div class="flex flex-wrap items-center justify-center gap-3">
            <span id="cloud-sync-badge" onclick="pullFromCloud(true)" class="cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-indigo-50 text-indigo-700 hover:bg-indigo-100 transition" title="Click to sync with Google Sheets Cloud">

            </span>

    <!-- JAVASCRIPT APPLICATION LOGIC -->
    <script>
        const DEFAULT_CLOUD_SYNC_URL = "https://script.google.com/macros/s/AKfycbwiN5ysn2COuVwAQ5ceZC0HopSHqbKnSrqMn_XQtFxasvlN9naEr4lp7U-aFNHcV3ardA/exec"; 

        const DB_KEYS = {
            SETTINGS: 'happyhome_quiz_settings_v13',
            TEACHERS: 'happyhome_quiz_teachers_v13',
            QUESTIONS: 'happyhome_quiz_questions_v13',
            ATTEMPTS: 'happyhome_quiz_attempts_v13',
            CURRENT_USER: 'happyhome_quiz_current_user_v13',
            CLOUD_URL: 'happyhome_quiz_cloud_url_v13',
            PENDING_SYNC: 'happyhome_quiz_pending_sync_v13'
        };

        const TABLE_KEY_MAP = {
            SETTINGS: DB_KEYS.SETTINGS,
            TEACHERS: DB_KEYS.TEACHERS,
            QUESTIONS: DB_KEYS.QUESTIONS
        };

        const HAPPY_CLASSES = ['Basic 1', 'Basic 2', 'Basic 3', 'Basic 4', 'Basic 5', 'Basic 6', 'JHS 1', 'JHS 2', 'JHS 3'];
        const HAPPY_SUBJECTS = ['English Language', 'Mathematics', 'Science', 'R.M.E.', 'Social Studies'];

        let activeQuizState = {
            questions: [],
            answers: {},
            timerInterval: null,
            secondsRemaining: 0,
            activeStudent: null,
            subject: '',
            classGroup: ''
        };

        // --- PWA Installation Logic ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const installBtn = document.getElementById('installAppBtn');
            if (installBtn) installBtn.classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted the install prompt');
                    }
                    deferredPrompt = null;
                    const installBtn = document.getElementById('installAppBtn');
                    if (installBtn) installBtn.classList.add('hidden');
                });
            }
        }

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js').catch(err => console.log('SW Registration failed:', err));
            });
        }

        // --- App Logic ---
        function getCloudSyncUrl() {
            const s = getSettings();
            return (s.cloudSyncUrl && s.cloudSyncUrl.trim() !== '') 
                ? s.cloudSyncUrl.trim() 
                : (localStorage.getItem(DB_KEYS.CLOUD_URL) || DEFAULT_CLOUD_SYNC_URL).trim();
        }

        function setCloudBadgeStatus(state, text) {
            const badge = document.getElementById('cloud-sync-badge');
            if (!badge) return;
            if (state === 'syncing') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-blue-100 text-blue-800";
                badge.innerHTML = `<i class="fas fa-sync fa-spin mr-1.5"></i> ${text || 'Syncing Cloud...'}`;
            } else if (state === 'synced') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800";
                badge.innerHTML = `<i class="fas fa-cloud mr-1.5"></i> ${text || 'Cloud Synced'}`;
            } else if (state === 'pending') {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800";
                badge.innerHTML = `<i class="fas fa-cloud-upload-alt mr-1.5"></i> ${text || 'Queued Offline'}`;
            } else {
                badge.className = "cursor-pointer inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-slate-100 text-slate-600";
                badge.innerHTML = `<i class="fas fa-cloud mr-1.5"></i> ${text || 'Offline Mode'}`;
            }
        }

        async function saveTableAndSync(tableName, dataObj) {
            const storageKey = TABLE_KEY_MAP[tableName];
            if (!storageKey) return;
            localStorage.setItem(storageKey, JSON.stringify(dataObj));

            const url = getCloudSyncUrl();
            if (!url) {
                setCloudBadgeStatus('local', 'Offline Mode');
                return;
            }

            if (!navigator.onLine) {
                localStorage.setItem(DB_KEYS.PENDING_SYNC, 'true');
                setCloudBadgeStatus('pending', 'Saved Locally (Offline Queue)');
                return;
            }

            setCloudBadgeStatus('syncing', 'Saving to Cloud...');
            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'SYNC_TABLE', table: tableName, records: dataObj })
                });
                localStorage.removeItem(DB_KEYS.PENDING_SYNC);
                setCloudBadgeStatus('synced', 'Cloud Synced');
            } catch (err) {
                localStorage.setItem(DB_KEYS.PENDING_SYNC, 'true');
                setCloudBadgeStatus('pending', 'Sync Retry Queued');
            }
        }

        async function pushAllTablesToCloud(showNotification = true) {
            const url = getCloudSyncUrl();
            if (!url) {
                if (showNotification) showToast('Cloud URL Missing', 'Please paste your Google Apps Script Web App URL first.', true);
                return;
            }
            setCloudBadgeStatus('syncing', 'Pushing All Data...');
            const payloadData = {};
            Object.keys(TABLE_KEY_MAP).forEach(tableName => {
                const raw = localStorage.getItem(TABLE_KEY_MAP[tableName]);
                payloadData[tableName] = raw ? JSON.parse(raw) : null;
            });

            try {
                await fetch(url, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'SYNC_ALL', data: payloadData })
                });
                localStorage.removeItem(DB_KEYS.PENDING_SYNC);
                setCloudBadgeStatus('synced', 'All Data Pushed');
                if (showNotification) showToast('Cloud Push Complete', 'Data synchronized.');
            } catch (err) {
                setCloudBadgeStatus('pending', 'Push Failed');
                if (showNotification) showToast('Cloud Push Error', 'Could not reach Google Sheets. Check connection.', true);
            }
        }

        async function pullFromCloud(showNotification = false) {
            const url = getCloudSyncUrl();
            if (!url || !navigator.onLine) {
                setCloudBadgeStatus(url ? 'pending' : 'local', 'Offline Mode');
                return false;
            }

            setCloudBadgeStatus('syncing', 'Fetching Cloud Updates...');
            try {
                const res = await fetch(url + '?t=' + Date.now());
                const json = await res.json();
                if (json && json.status === 'success' && json.data) {
                    let updatedAny = false;
                    Object.keys(TABLE_KEY_MAP).forEach(tableName => {
                        const cloudVal = json.data[tableName];
                        if (cloudVal !== null && cloudVal !== undefined) {
                            if (tableName === 'SETTINGS') {
                                cloudVal.cloudSyncUrl = cloudVal.cloudSyncUrl || url;
                                cloudVal.adminPasscode = cloudVal.adminPasscode || getSettings().adminPasscode || 'admin123';
                            }
                            localStorage.setItem(TABLE_KEY_MAP[tableName], JSON.stringify(cloudVal));
                            updatedAny = true;
                        }
                    });
                    setCloudBadgeStatus('synced', 'Cloud Synced');
                    if (showNotification) showToast('Cloud Synced!', 'Latest records loaded successfully.');
                    if (updatedAny) renderApp();
                    return true;
                }
            } catch (err) {
                setCloudBadgeStatus('pending', 'Offline Mode');
            }
            return false;
        }

        function initDatabase() {
            if (!localStorage.getItem(DB_KEYS.SETTINGS)) {
                localStorage.setItem(DB_KEYS.SETTINGS, JSON.stringify({ schoolName: 'HAPPY HOME Preparatory School', location: 'Assin Amoabin', motto: 'Perseverance Endures', cloudSyncUrl: DEFAULT_CLOUD_SYNC_URL, adminPasscode: 'admin123' }));
            }
            if (!localStorage.getItem(DB_KEYS.TEACHERS)) localStorage.setItem(DB_KEYS.TEACHERS, JSON.stringify([]));
            if (!localStorage.getItem(DB_KEYS.QUESTIONS)) localStorage.setItem(DB_KEYS.QUESTIONS, JSON.stringify([]));
            if (!localStorage.getItem(DB_KEYS.ATTEMPTS)) localStorage.setItem(DB_KEYS.ATTEMPTS, JSON.stringify([]));
        }

        function getSettings() {
            const raw = localStorage.getItem(DB_KEYS.SETTINGS);
            return raw ? JSON.parse(raw) : { schoolName: 'HAPPY HOME Preparatory School', location: 'Assin Amoabin', motto: 'Perseverance Endures', cloudSyncUrl: DEFAULT_CLOUD_SYNC_URL, adminPasscode: 'admin123' };
        }

        function renderLogoHTML(sizeClasses = 'w-10 h-10', iconTextSize = 'text-lg') {
            return `<img src="logo.png" alt="School Logo" class="${sizeClasses} object-contain bg-white rounded-full p-0.5 shadow-sm border border-purple-200 shrink-0" onerror="this.onerror=null; this.parentNode.innerHTML='<div class=\\'${sizeClasses} rounded-full bg-white text-primary flex items-center justify-center font-black shadow-sm border border-purple-200 shrink-0\\'><i class=\\'fas fa-graduation-cap ${iconTextSize} leading-none\\'></i></div>';">`;
        }

        function showToast(title, msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-title').innerText = title;
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').className = isError ? "fas fa-exclamation-circle text-red-600 text-xl" : "fas fa-check-circle text-emerald-600 text-xl";
            toast.classList.remove('translate-x-full');
            setTimeout(() => toast.classList.add('translate-x-full'), 3500);
        }

        function getCurrentUser() {
            const raw = localStorage.getItem(DB_KEYS.CURRENT_USER);
            return raw ? JSON.parse(raw) : null;
        }

        window.addEventListener('online', () => {
            document.getElementById('network-badge').className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-emerald-100 text-emerald-800";
            document.getElementById('network-badge').innerHTML = `<span class="w-2 h-2 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span> Online Mode`;
            syncOfflineSubmissions();
            if (localStorage.getItem(DB_KEYS.PENDING_SYNC) === 'true' && getCloudSyncUrl()) pushAllTablesToCloud(false);
        });

        window.addEventListener('offline', () => {
            document.getElementById('network-badge').className = "inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold bg-amber-100 text-amber-800";
            document.getElementById('network-badge').innerHTML = `<span class="w-2 h-2 mr-1.5 bg-amber-500 rounded-full"></span> Offline Mode`;
        });

        function renderApp(viewOverride = null) {
            const app = document.getElementById('app');
            const currentUser = getCurrentUser();
            if (viewOverride === 'student' || (!currentUser && viewOverride !== 'teacher')) {
                app.innerHTML = getStudentPortalHTML();
                attachStudentPortalListeners();
            } else {
                app.innerHTML = getStaffPortalHTML(currentUser);
                attachStaffPortalListeners();
            }
            setCloudBadgeStatus(getCloudSyncUrl() ? 'synced' : 'local', getCloudSyncUrl() ? 'Cloud Synced' : 'Offline Mode');
        }

        function getStudentPortalHTML() {
            const s = getSettings();
            return `
                <header class="bg-primary text-white shadow-md">
                    <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between">
                        <div class="flex items-center space-x-3">
                            ${renderLogoHTML('w-10 h-10', 'text-lg')}
                            <div>
                                <h1 class="font-bold text-sm sm:text-base leading-tight">${s.schoolName}, ${s.location}</h1>
                                <p class="text-[11px] text-purple-200 italic">Motto: ${s.motto}</p>
                            </div>
                        </div>
                        <div class="flex items-center space-x-2">
                            <button id="installAppBtn" onclick="installPWA()" class="hidden px-3 py-1.5 text-xs sm:text-sm bg-yellow-400 text-yellow-900 font-bold rounded shadow transition hover:bg-yellow-300">

                            </button>
                            <button onclick="renderApp('student')" class="px-3 py-1.5 text-xs sm:text-sm bg-white text-primary font-semibold rounded shadow transition">Student Portal</button>

                <main class="max-w-4xl w-full mx-auto p-4 flex-grow my-4">

                                <label class="block text-sm font-medium mb-1">Select Class</label>
                                <select id="studentClass" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                                    <option value="">-- Choose Class --</option>
                                    ${HAPPY_CLASSES.map(c => `<option value="${c}">${c}</option>`).join('')}
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium mb-1">Select Subject</label>
                                <select id="studentSubject" required class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-purple-500 outline-none">
                                    <option value="">-- Choose Subject --</option>

                    <div id="examInterface" class="hidden bg-white p-6 rounded-xl shadow-sm border border-gray-100">

                        <div>
                            <h4 class="text-xs font-black uppercase tracking-widest text-purple-700">${s.schoolName}, ${s.location}</h4>

        function attachStudentPortalListeners() {
            document.getElementById('startTestForm').addEventListener('submit', (e) => {
                e.preventDefault();
                const name = document.getElementById('studentName').value.trim();
                const sClass = document.getElementById('studentClass').value;
                const subject = document.getElementById('studentSubject').value;

                const allQuestions = JSON.parse(localStorage.getItem(DB_KEYS.QUESTIONS) || '[]');
                let matchingQuestions = allQuestions.filter(q => q.class === sClass && q.subject === subject);

                if (matchingQuestions.length === 0) {
                    alert(`No questions available for ${sClass} - ${subject}. Please ask your teacher to add questions to the question bank.`);
                    return;
                }

                matchingQuestions.sort(() => Math.random() - 0.5);
                activeQuizState.questions = matchingQuestions.slice(0, 10);
                activeQuizState.activeStudent = { name, class: sClass, subject };
                activeQuizState.answers = {};

                document.getElementById('studentLoginForm').classList.add('hidden');
                document.getElementById('examInterface').classList.remove('hidden');
                document.getElementById('examTitleDisplay').innerText = `${subject} (${sClass}) - ${activeQuizState.questions.length} Questions`;
                document.getElementById('studentInfoDisplay').innerText = `Student: ${name} | Class: ${sClass}`;

                activeQuizState.secondsRemaining = (activeQuizState.questions[0].timer || 10) * 60;
                startExamTimer();
                renderExamQuestions();
            });
        }

        function startExamTimer() {
            if (activeQuizState.timerInterval) clearInterval(activeQuizState.timerInterval);
            activeQuizState.timerInterval = setInterval(() => {
                if (activeQuizState.secondsRemaining <= 0) {
                    clearInterval(activeQuizState.timerInterval);
                    alert("Time is up! Submitting exam automatically.");
                    submitStudentExam();
                    return;
                }
                activeQuizState.secondsRemaining--;
                let mins = Math.floor(activeQuizState.secondsRemaining / 60);
                let secs = activeQuizState.secondsRemaining % 60;
                const timeCountEl = document.getElementById('timeCount');
                if (timeCountEl) {
                    timeCountEl.innerText = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
                }
            }, 1000);
        }

        function renderExamQuestions() {
            const container = document.getElementById('questionContainer');
            container.innerHTML = "";
            activeQuizState.questions.forEach((q, index) => {
                container.innerHTML += `
                    <div class="p-4 bg-gray-50 rounded-lg border space-y-3">
                        <p class="font-semibold text-gray-800">Q${index + 1}. ${q.text}</p>
                        <div class="space-y-2 pl-2">
                            <label class="flex items-center space-x-3 cursor-pointer"><input type="radio" name="q_${q.id}" value="A" onchange="activeQuizState.answers[${q.id}]='A'"> <span>A) ${q.optA}</span></label>
                            <label class="flex items-center space-x-3 cursor-pointer"><input type="radio" name="q_${q.id}" value="B" onchange="activeQuizState.answers[${q.id}]='B'"> <span>B) ${q.optB}</span></label>
                            <label class="flex items-center space-x-3 cursor-pointer"><input type="radio" name="q_${q.id}" value="C" onchange="activeQuizState.answers[${q.id}]='C'"> <span>C) ${q.optC}</span></label>
                            <label class="flex items-center space-x-3 cursor-pointer"><input type="radio" name="q_${q.id}" value="D" onchange="activeQuizState.answers[${q.id}]='D'"> <span>D) ${q.optD}</span></label>
                        </div>
                    </div>
                `;
            });
        }

        function submitStudentExam() {
            if (activeQuizState.timerInterval) clearInterval(activeQuizState.timerInterval);
            let score = 0;
            let total = activeQuizState.questions.length;

            activeQuizState.questions.forEach(q => {
                if (activeQuizState.answers[q.id] && activeQuizState.answers[q.id] === q.correct) {
                    score++;
                }
            });

            let percentage = Math.round((score / total) * 100);
            let feedback = "";
            if (percentage >= 80) feedback = "80% - 100% (Excellent): Exceptional understanding demonstrated across all tasks.";
            else if (percentage >= 70) feedback = "70% - 79% (Very Good): Displays a very strong grasp of coursework.";
            else if (percentage >= 60) feedback = "60% - 69% (Good): Shows steady academic progress and effort.";
            else if (percentage >= 50) feedback = "50% - 59% (Satisfactory): Meets the fundamental requirements of the course.";
            else feedback = "Below 50%, Needs Improvement: \"Requires more focused effort to meet fundamental learning goals.\"";

            document.getElementById('examInterface').classList.add('hidden');
            document.getElementById('resultInterface').classList.remove('hidden');
            
            document.getElementById('certStudentName').innerText = activeQuizState.activeStudent.name;
            document.getElementById('certStudentClass').innerText = activeQuizState.activeStudent.class;
            document.getElementById('certSubject').innerText = activeQuizState.activeStudent.subject;
            document.getElementById('certScoreText').innerText = `${score} / ${total}`;
            document.getElementById('certPercentageText').innerText = `${percentage}% Score`;
            document.getElementById('certFeedbackBox').innerText = feedback;

            const submissionData = {
                id: 'ATT-' + Math.random().toString(36).substr(2,6).toUpperCase(),
                name: activeQuizState.activeStudent.name,
                class: activeQuizState.activeStudent.class,
                subject: activeQuizState.activeStudent.subject,
                score: score,
                total: total,
                percentage: percentage,
                feedback: feedback,
                timestamp: new Date().toLocaleString()
            };

            const attempts = JSON.parse(localStorage.getItem(DB_KEYS.ATTEMPTS) || '[]');
            attempts.unshift(submissionData);
            localStorage.setItem(DB_KEYS.ATTEMPTS, JSON.stringify(attempts));
            
            dispatchSubmissionToSheet(submissionData);
        }

        function dispatchSubmissionToSheet(data) {
            const url = getCloudSyncUrl();
            if (!url) {
                saveToOfflineQueue(data);
                return;
            }
            if (!navigator.onLine) {
                saveToOfflineQueue(data);
                showToast("Offline Mode", "Result saved locally. Will sync when online.", true);
                return;
            }
            fetch(url, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({ action: 'APPEND_RESULT', record: data })
            }).catch(() => saveToOfflineQueue(data));
        }

        function saveToOfflineQueue(data) {
            let queue = JSON.parse(localStorage.getItem(DB_KEYS.PENDING_SYNC + '_results') || '[]');
            queue.push(data);
            localStorage.setItem(DB_KEYS.PENDING_SYNC + '_results', JSON.stringify(queue));
        }

        function syncOfflineSubmissions() {
            const url = getCloudSyncUrl();
            let queue = JSON.parse(localStorage.getItem(DB_KEYS.PENDING_SYNC + '_results') || '[]');
            if (queue.length === 0 || !url) return;

            queue.forEach(item => {
                fetch(url, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: 'APPEND_RESULT', record: item })
                });
            });
            localStorage.removeItem(DB_KEYS.PENDING_SYNC + '_results');
        }

            renderApp('student');

                    const teachers = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
                    if (teachers.some(t => t.username === username) || username === 'admin') {
                        alert("Username already exists!");

                    createTForm.reset();
                    renderTeacherList();

                        if (newP !== confirmP) {
                            alert("New passwords do not match.");

        function parseTextIntoQuestions() {
            const rawText = document.getElementById('ai-raw-text').value.trim();
            if (!rawText) {
                alert("Please paste text, CSV, or upload a document first.");
                return;
            }

            const questions = JSON.parse(localStorage.getItem(DB_KEYS.QUESTIONS) || '[]');
            let parsedCount = 0;

            if (rawText.includes(',')) {
                const rows = rawText.split('\n').map(r => r.trim()).filter(Boolean);
                rows.forEach((row, idx) => {
                    if (idx === 0 && row.toLowerCase().includes('question')) return;
                    const cols = row.split(',').map(c => c.trim());
                    if (cols.length >= 8) {
                        questions.push({
                            id: Date.now() + Math.random(),
                            class: cols[0] || document.getElementById('qClass').value,
                            subject: cols[1] || document.getElementById('qSubject').value,
                            text: cols[2],
                            optA: cols[3],
                            optB: cols[4],
                            optC: cols[5],
                            optD: cols[6],
                            correct: (cols[7] || 'A').toUpperCase(),
                            timer: parseInt(cols[8]) || 10
                        });
                        parsedCount++;
                    }
                });
            }

            if (parsedCount === 0) {
                const lines = rawText.split('\n').map(l => l.trim()).filter(Boolean);
                let currentQ = '';
                let currentOpts = [];
                let correctOpt = 'A';

                lines.forEach(line => {
                    if (/^\d+[\.\)]/.test(line)) {
                        if (currentQ && currentOpts.length >= 2) {
                            questions.push({
                                id: Date.now() + Math.random(),
                                class: document.getElementById('qClass').value,
                                subject: document.getElementById('qSubject').value,
                                text: currentQ,
                                optA: currentOpts[0] || 'Option A',
                                optB: currentOpts[1] || 'Option B',
                                optC: currentOpts[2] || 'Option C',
                                optD: currentOpts[3] || 'Option D',
                                correct: correctOpt,
                                timer: 10
                            });
                            parsedCount++;
                        }
                        currentQ = line.replace(/^\d+[\.\)]\s*/, '');
                        currentOpts = [];
                        correctOpt = 'A';
                    } else if (/^[a-dA-D][\.\)]/.test(line)) {
                        currentOpts.push(line.replace(/^[a-dA-D][\.\)]\s*/, ''));
                        if (line.toLowerCase().includes('(correct)') || /^\[?correct\]?/i.test(line)) {
                            correctOpt = line.charAt(0).toUpperCase();
                        }
                    } else if (currentQ && currentOpts.length < 4) {
                        currentOpts.push(line);
                    }
                });

                if (currentQ && currentOpts.length >= 2) {
                    questions.push({
                        id: Date.now() + Math.random(),
                        class: document.getElementById('qClass').value,
                        subject: document.getElementById('qSubject').value,
                        text: currentQ,
                        optA: currentOpts[0] || 'Option A',
                        optB: currentOpts[1] || 'Option B',
                        optC: currentOpts[2] || 'Option C',
                        optD: currentOpts[3] || 'Option D',
                        correct: correctOpt,
                        timer: 10
                    });
                    parsedCount++;
                }
            }

            saveTableAndSync('QUESTIONS', questions);
            renderQuestionList();
            alert(`Importer successfully added ${parsedCount} question(s) to the question bank!`);
        }

        function renderQuestionList() {
            const container = document.getElementById('questionListContainer');
            if (!container) return;
            const questions = JSON.parse(localStorage.getItem(DB_KEYS.QUESTIONS) || '[]');
            container.innerHTML = "";
            if (questions.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-400">No questions available.</p>`;
                return;
            }
            questions.forEach(q => {
                container.innerHTML += `
                    <div class="flex justify-between items-center p-2 bg-gray-50 border rounded text-xs">
                        <div><b>[${q.class} - ${q.subject}]</b> ${q.text.substring(0, 50)}... (Correct: ${q.correct})</div>
                        <button onclick="deleteQuestion(${q.id})" class="text-red-500 font-bold px-2 py-1 hover:bg-red-50 rounded">Delete</button>
                    </div>
                `;
            });
        }

        function deleteQuestion(id) {
            let questions = JSON.parse(localStorage.getItem(DB_KEYS.QUESTIONS) || '[]');
            questions = questions.filter(q => q.id !== id);
            saveTableAndSync('QUESTIONS', questions);
            renderQuestionList();
        }

        function renderTeacherList() {
            const container = document.getElementById('teacherListContainer');
            if (!container) return;
            const teachers = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
            const currentUser = getCurrentUser();
            container.innerHTML = "";
            teachers.forEach(t => {
                const classesStr = t.assignedClasses ? t.assignedClasses.join(', ') : 'All Classes';
                container.innerHTML += `
                    <div class="flex justify-between items-center p-2.5 bg-gray-50 border rounded text-xs">
                        <div><b>${t.name}</b> (${t.username}) - Assigned Classes: <span class="text-indigo-600 font-bold">${classesStr}</span> - <span class="uppercase text-purple-600 font-semibold">${t.role}</span></div>
                        ${currentUser && currentUser.role === 'admin' ? `<button onclick="deleteTeacher('${t.id}')" class="text-red-500 font-bold px-2 py-1 hover:bg-red-50 rounded">Remove</button>` : ''}
                    </div>
                `;
            });
        }

        function deleteTeacher(teacherId) {
            if (!confirm("Are you sure you want to remove this teacher?")) return;
            let teachers = JSON.parse(localStorage.getItem(DB_KEYS.TEACHERS) || '[]');
            teachers = teachers.filter(t => t.id !== teacherId);
            saveTableAndSync('TEACHERS', teachers);
            renderTeacherList();
            showToast("Success", "Teacher removed successfully.");
        }

        function saveCloudUrlSetting() {
            const urlInput = document.getElementById('settingCloudUrl').value.trim();
            localStorage.setItem(DB_KEYS.CLOUD_URL, urlInput);
            const s = getSettings();
            s.cloudSyncUrl = urlInput;
            saveTableAndSync('SETTINGS', s);
            alert("Cloud URL saved successfully!");
            pullFromCloud(true);
        }

        window.onload = function() {
            initDatabase();
            renderApp();
            if (getCloudSyncUrl()) {
                pullFromCloud(false);
            }
        };
    </script>
</body>
</html>
